<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Schwarzer abgerundeter Hintergrund -->
  <rect width="512" height="512" rx="90" fill="#111111"/>
  <!-- Weißes H -->
  <text x="230" y="360" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="800" font-size="290" fill="white" text-anchor="middle">H</text>
  <!-- Lila D oben rechts mit Farbverlauf -->
  <text x="400" y="195" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="800" font-size="185" fill="url(#grad)" text-anchor="middle">D</text>
</svg>