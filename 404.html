<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Weiterleitung…</title>
    <script>
      // Single Page Apps for GitHub Pages — only handles paths under one of
      // the SPA_ROOTS below, each a self-contained app in its own subfolder
      // (e.g. /app/ = ClubConnect). Everything else falls through to the
      // plain "not found" message below.
      // Based on https://github.com/rafgraph/spa-github-pages
      var SPA_ROOTS = [
        "app", // ClubConnect (huebbedigital1/app/)
        // "spotswap", // SpotSwap — enable once huebbedigital1/spotswap/index.html
        // exists from a real build; enabling it earlier causes a redirect loop
        // here, since there is nothing yet to redirect to. See spotswap/README.md.
      ];
      var l = window.location;
      var firstSegment = l.pathname.split("/")[1];
      if (SPA_ROOTS.indexOf(firstSegment) !== -1) {
        var segmentCount = 1; // the app's own path segment, e.g. "/app"
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
            "/?p=/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(segmentCount)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      }
    </script>
    <style>
      body { font-family: system-ui, sans-serif; background: #faf8f2; color: #1c1b18; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 2rem; }
    </style>
  </head>
  <body>
    <div>
      <h1>Seite nicht gefunden</h1>
      <p><a href="/">Zurück zur Startseite</a></p>
    </div>
  </body>
</html>
