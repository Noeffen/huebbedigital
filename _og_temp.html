<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Inter';src:local('Inter'),local('Inter-Regular'),url('fonts/inter.woff2') format('woff2');font-weight:100 900;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:#0F1923;
    position:relative;
    display:flex;
    align-items:center;
  }
  .glow1 { position:absolute; width:800px; height:800px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,.28) 0%, transparent 68%); top:-320px; right:-220px; filter:blur(10px); }
  .glow2 { position:absolute; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(124,58,237,.24) 0%, transparent 68%); bottom:-260px; left:-160px; filter:blur(10px); }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size:48px 48px; }
  .content { position:relative; z-index:2; padding:0 90px; width:100%; }
  .eyebrow { font-size:20px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#93c5fd; opacity:.9; margin-bottom:26px; }
  .brand { font-size:64px; font-weight:900; letter-spacing:-.03em; color:#fff; margin-bottom:22px; line-height:1; }
  .brand span { background:linear-gradient(135deg,#3B82F6,#7C3AED); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .tagline { font-size:32px; font-weight:600; color:rgba(255,255,255,.7); line-height:1.35; max-width:820px; margin-bottom:36px; }
  .pills { display:flex; gap:14px; }
  .pill { padding:12px 26px; border-radius:999px; font-size:19px; font-weight:700; border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.85); }
  .pill.accent { background:linear-gradient(135deg,#3B82F6,#7C3AED); border:none; color:#fff; }
  .diamond { position:absolute; right:70px; top:50%; transform:translateY(-50%); width:340px; height:340px; opacity:.5; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <svg class="diamond" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="200" y2="220" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3B82F6"/>
        <stop offset="1" stop-color="#7C3AED"/>
      </linearGradient>
    </defs>
    <path d="M100 10 L180 70 L100 210 L20 70 Z" stroke="url(#g1)" stroke-width="1.6" opacity="0.9"/>
    <path d="M60 10 L100 10 L140 10" stroke="url(#g1)" stroke-width="1.6" opacity="0.5"/>
    <path d="M20 70 L180 70" stroke="url(#g1)" stroke-width="1.6" opacity="0.7"/>
    <path d="M100 10 L100 210" stroke="url(#g1)" stroke-width="1.2" opacity="0.4"/>
    <path d="M60 10 L20 70" stroke="url(#g1)" stroke-width="1.2" opacity="0.5"/>
    <path d="M140 10 L180 70" stroke="url(#g1)" stroke-width="1.2" opacity="0.5"/>
    <path d="M55 70 L100 210" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
    <path d="M145 70 L100 210" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
  </svg>
  <div class="content">
    <div class="eyebrow">Webdesign · Apps · SEO · Odenwald</div>
    <div class="brand">Huebbe<span>Digital</span></div>
    <div class="tagline">Individuelle Websites, Apps und SEO-Strategien für Unternehmen im Odenwald und Rhein-Main-Gebiet.</div>
    <div class="pills">
      <span class="pill accent">Webdesign</span>
      <span class="pill">SEO-Optimierung</span>
      <span class="pill">iOS & Android</span>
    </div>
  </div>
</body>
</html>
